<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>自行车骑马 · 边塞夜行</title>
<style>
  :root{--gold:#ffcf92;--teal:#55e0c8;--ink:#07060d}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#05040a;display:flex;align-items:center;justify-content:center;
    font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  .frame{position:relative;width:min(96vw,1200px);aspect-ratio:1200/700;overflow:hidden;border-radius:20px;
    box-shadow:0 40px 90px -30px #000,0 0 0 1px #ffffff12 inset}
  .frame svg{display:block;width:100%;height:100%}
  /* 缓慢推镜 */
  .bg-photo{animation:push 46s ease-in-out infinite alternate;transform-origin:52% 46%}
  @keyframes push{from{transform:scale(1.02) translate(0,0)}to{transform:scale(1.09) translate(-1.2%,-1%)}}
  .fog{animation:drift 38s linear infinite}
  .fog2{animation:drift 61s linear infinite reverse}
  @keyframes drift{from{transform:translateX(-4%)}to{transform:translateX(4%)}}
  .mote{animation:mote 6s ease-in-out infinite}
  .m2{animation-delay:1.1s}.m3{animation-delay:2.4s}.m4{animation-delay:3.6s}.m5{animation-delay:4.7s}
  @keyframes mote{0%,100%{opacity:.12;transform:translateY(0)}50%{opacity:.75;transform:translateY(-18px)}}
  .flame{animation:flame 1.6s ease-in-out infinite;transform-origin:center bottom}
  @keyframes flame{0%,100%{transform:scale(1,.94);opacity:.95}50%{transform:scale(.9,1.1);opacity:1}}
  .bike{animation:bob 5.6s ease-in-out infinite;transform-origin:center}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-4px) rotate(-1deg)}}
  .horse{animation:breath 7s ease-in-out infinite;transform-origin:center bottom}
  @keyframes breath{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.012)}}
  .title{position:absolute;left:3.2%;top:5%;color:#ffe7c4;font-size:clamp(13px,1.7vw,21px);letter-spacing:.14em;
    text-shadow:0 2px 14px #000a}
  .title b{display:block;margin-top:.5em;font-weight:600;font-size:1.5em;letter-spacing:.1em;color:#fff3dc}
  .credit{position:absolute;right:2.6%;bottom:2.4%;color:#ffffff5e;font-size:clamp(8px,.85vw,11px);letter-spacing:.04em;
    text-align:right;line-height:1.6}
  .tag{position:absolute;left:3.2%;bottom:3.2%;color:#ffffff55;font-size:clamp(8px,.85vw,11px);letter-spacing:.22em}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="frame">
<svg viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="bloom" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#231a38" stop-opacity=".86"/>
      <stop offset="45%" stop-color="#1a1430" stop-opacity=".72"/>
      <stop offset="100%" stop-color="#08060f" stop-opacity=".95"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe7bd" stop-opacity=".85"/>
      <stop offset="40%" stop-color="#ffcf92" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#ffcf92" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity="0"/>
      <stop offset="72%" stop-color="#ffd9a0" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#fff3dc" stop-opacity=".95"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="46%" r="72%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".78"/>
    </radialGradient>
    <linearGradient id="groundFog" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9b6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c9b6ff" stop-opacity=".13"/>
      <stop offset="100%" stop-color="#c9b6ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clipBike"><rect x="-10" y="-10" width="790" height="490"/></clipPath>
  </defs>

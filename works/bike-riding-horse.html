<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自行车骑马 · Bike Riding a Horse</title>
<style>
  :root{
    --sky-1:#1b2340; --sky-2:#3b2a52; --sky-3:#8a4a5e; --sun:#ffd9a0;
    --hill-far:#2c3357; --hill-near:#33283c; --ground:#151a2c;
    --horse-1:#8a5a3b; --horse-2:#5e3a24; --horse-3:#3d2517;
    --bike:#e8eef7; --accent:#55e0c8;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:radial-gradient(120% 120% at 50% 0%,#0e1120 0%,#080a14 60%,#05060c 100%);
    display:grid;place-items:center;font-family:ui-sans-serif,system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
    color:#cfd8ee;overflow:hidden;
  }
  .stage{width:min(94vw,1200px);aspect-ratio:12/7;position:relative;
    border-radius:22px;overflow:hidden;
    box-shadow:0 30px 80px -20px #000,0 0 0 1px #ffffff14;
    background:#0b0e18}
  .stage::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(90% 70% at 50% 30%,transparent 40%,#000a 100%)}
  svg{width:100%;height:100%;display:block}
  .title{position:absolute;left:22px;top:18px;font-size:13px;letter-spacing:.28em;
    text-transform:uppercase;color:#ffffff8c}
  .title b{display:block;font-size:22px;letter-spacing:.06em;color:#fff;margin-top:6px;font-weight:600}
  .hint{position:absolute;right:20px;bottom:16px;font-size:12px;color:#ffffff5e}

  /* ---- motion ---- */
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  @keyframes bob-bike{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-14px) rotate(1.2deg)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes gallop-a{0%,100%{transform:rotate(24deg)}50%{transform:rotate(-26deg)}}
  @keyframes gallop-b{0%,100%{transform:rotate(-22deg)}50%{transform:rotate(26deg)}}
  @keyframes tail{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(10deg)}}
  @keyframes dust{0%{transform:translate(0,0) scale(.6);opacity:0}
    30%{opacity:.55}100%{transform:translate(-260px,-40px) scale(1.6);opacity:0}}
  @keyframes scroll{to{transform:translateX(-1200px)}}
  @keyframes flicker{0%,100%{opacity:.85}50%{opacity:.5}}

  .scene{animation:bob .62s ease-in-out infinite}
  .bike{animation:bob-bike .62s ease-in-out infinite;transform-origin:center}
  .wheel{animation:spin .55s linear infinite;transform-box:fill-box;transform-origin:center}
  .wheel.back{animation-duration:.62s}
  .crank{animation:spin .5s linear infinite;transform-box:fill-box;transform-origin:center}
  .leg.fl{transform-box:fill-box;transform-origin:50% 4%;animation:gallop-a .62s ease-in-out infinite}
  .leg.fr{transform-box:fill-box;transform-origin:50% 4%;animation:gallop-b .62s ease-in-out infinite}
  .leg.bl{transform-box:fill-box;transform-origin:50% 4%;animation:gallop-b .62s ease-in-out infinite}
  .leg.br{transform-box:fill-box;transform-origin:50% 4%;animation:gallop-a .62s ease-in-out infinite}
  .tail{transform-box:fill-box;transform-origin:0% 20%;animation:tail .62s ease-in-out infinite}
  .hills-far{animation:scroll 9s linear infinite}
  .hills-near{animation:scroll 5.2s linear infinite}
  .p1{animation:dust 1.9s ease-out infinite}
  .p2{animation:dust 1.9s ease-out .5s infinite}
  .p3{animation:dust 1.9s ease-out 1s infinite}
  .p4{animation:dust 1.9s ease-out 1.35s infinite}
  .sun{animation:flicker 5s ease-in-out infinite}

  /* 边塞动态 */
  @keyframes flame{0%,100%{transform:scaleY(1) scaleX(1);opacity:.9}50%{transform:scaleY(1.25) scaleX(.9);opacity:.65}}
  @keyframes smoke{0%{transform:translate(0,0) scale(.5);opacity:.3}100%{transform:translate(-40px,-90px) scale(1.7);opacity:0}}
  @keyframes wave{0%,100%{transform:skewY(0deg)}50%{transform:skewY(-4deg)}}
  .flame{transform-box:fill-box;transform-origin:50% 100%;animation:flame .9s ease-in-out infinite}
  .flame.slow{animation-duration:1.3s}
  .smoke{transform-box:fill-box;transform-origin:center;animation:smoke 4.5s ease-out infinite}
  .s2{animation-delay:1.4s}
  .s3{animation-delay:.8s}
  .flag{transform-box:fill-box;transform-origin:0% 50%;animation:wave 2.6s ease-in-out infinite}
  .f2{animation-delay:.7s}
  @keyframes mote{0%,100%{opacity:.15;transform:translateY(0)}50%{opacity:.7;transform:translateY(-14px)}}
  .mote{animation:mote 4s ease-in-out infinite}
  .m2{animation-delay:.8s}.m3{animation-delay:1.6s}.m4{animation-delay:2.4s}.m5{animation-delay:3.1s}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="stage">
  <svg viewBox="0 0 1200 700" role="img" aria-label="一辆自行车骑在马背上奔跑">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#141a30"/>
        <stop offset="45%" stop-color="#2a2344"/>
        <stop offset="72%" stop-color="#5c3350"/>
        <stop offset="100%" stop-color="#8a4a5e"/>
      </linearGradient>
      <radialGradient id="glow" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#ffd9a0" stop-opacity=".95"/>
        <stop offset="55%" stop-color="#ff9f6b" stop-opacity=".35"/>
        <stop offset="100%" stop-color="#ff9f6b" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="horseGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#a06b47"/>
        <stop offset="55%" stop-color="#7c4d30"/>
        <stop offset="100%" stop-color="#4d2f1c"/>
      </linearGradient>
      <linearGradient id="bikeGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f4f8ff"/>
        <stop offset="100%" stop-color="#9fb0c9"/>
      </linearGradient>
      <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#3a2c33"/>
        <stop offset="100%" stop-color="#0d0a12"/>
      </linearGradient>
      <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="6"/>
      </filter>
      <linearGradient id="beam" x1="1" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffd9a0" stop-opacity=".28"/>
        <stop offset="60%" stop-color="#ffd9a0" stop-opacity=".06"/>
        <stop offset="100%" stop-color="#ffd9a0" stop-opacity="0"/>
      </linearGradient>
      <radialGradient id="groundLight" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#ffcf92" stop-opacity=".3"/>
        <stop offset="55%" stop-color="#ffb56b" stop-opacity=".1"/>
        <stop offset="100%" stop-color="#ffb56b" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#ffd9a0" stop-opacity="0"/>
        <stop offset="70%" stop-color="#ffd9a0" stop-opacity=".5"/>
        <stop offset="100%" stop-color="#fff0d0" stop-opacity=".9"/>
      </linearGradient>
      <pattern id="merlon" width="72" height="36" patternUnits="userSpaceOnUse">
        <rect width="44" height="36" fill="#2b2540"/>
      </pattern>
    </defs>

    <!-- sky -->
    <rect width="1200" height="700" fill="url(#sky)"/>
    <g class="sun">
      <circle cx="880" cy="190" r="190" fill="url(#glow)"/>
      <circle cx="880" cy="190" r="46" fill="#ffe3b8"/>
    </g>

    <!-- stars -->
    <g fill="#ffffff" opacity=".5">
      <circle cx="120" cy="80" r="1.6"/><circle cx="210" cy="140" r="1.2"/>
      <circle cx="330" cy="60" r="1.8"/><circle cx="470" cy="120" r="1.1"/>
      <circle cx="640" cy="70" r="1.5"/><circle cx="760" cy="140" r="1.2"/>
      <circle cx="980" cy="90" r="1.7"/><circle cx="1090" cy="150" r="1.3"/>
      <circle cx="60" cy="190" r="1.1"/><circle cx="400" cy="200" r="1"/>
    </g>

    <!-- 月光光柱 -->
    <polygon points="880,240 1180,700 300,700" fill="url(#beam)"/>

    <!-- far mountains (边塞) -->
    <g class="hills-far">
      <path d="M-1200 470 Q -1050 340 -900 460 T -600 470 T -300 430 T 0 470 L 0 700 L -1200 700 Z" fill="var(--hill-far)" opacity=".8"/>
      <path d="M0 470 Q 150 340 300 460 T 600 470 T 900 430 T 1200 470 L 1200 700 L 0 700 Z" fill="var(--hill-far)" opacity=".8"/>
    </g>

    <!-- 边塞城墙 -->
    <g id="border-wall">
      <!-- wall body -->
      <rect x="-80" y="504" width="1360" height="110" fill="#241f33"/>
      <g stroke="#3a3350" stroke-width="1.5" opacity=".55">
        <line x1="-80" y1="536" x2="1280" y2="536"/>
        <line x1="-80" y1="568" x2="1280" y2="568"/>
      </g>
      <!-- battlements -->
      <rect x="-80" y="470" width="1360" height="36" fill="url(#merlon)"/>

      <!-- 烽火台 left -->
      <g>
        <path d="M148 470 L 162 338 L 252 338 L 266 470 Z" fill="#2b2540"/>
        <path d="M148 470 L 162 338 L 200 338 L 200 470 Z" fill="#332c4a" opacity=".8"/>
        <rect x="154" y="318" width="112" height="22" rx="4" fill="#3a3350"/>
        <circle cx="210" cy="404" r="9" fill="#151121"/>
        <!-- fire -->
        <g class="flame">
          <path d="M210 318 C 198 300 204 286 210 274 C 218 288 224 302 210 318 Z" fill="#ffb454" opacity=".9"/>
        </g>
      </g>

      <!-- 烽火台 right -->
      <g>
        <path d="M968 470 L 980 356 L 1064 356 L 1076 470 Z" fill="#2b2540"/>
        <path d="M968 470 L 980 356 L 1016 356 L 1016 470 Z" fill="#332c4a" opacity=".8"/>
        <rect x="972" y="338" width="100" height="20" rx="4" fill="#3a3350"/>
        <circle cx="1022" cy="412" r="8" fill="#151121"/>
        <g class="flame slow">
          <path d="M1022 338 C 1012 322 1018 310 1022 300 C 1030 312 1036 324 1022 338 Z" fill="#ffb454" opacity=".8"/>
        </g>
      </g>

      <!-- 烽烟 -->
      <g fill="#8f86a8" opacity=".22">
        <circle class="smoke s1" cx="210" cy="270" r="16"/>
        <circle class="smoke s2" cx="210" cy="260" r="22"/>
        <circle class="smoke s3" cx="1022" cy="296" r="14"/>
      </g>

      <!-- 战旗 -->
      <g>
        <line x1="120" y1="470" x2="120" y2="384" stroke="#3a3350" stroke-width="5"/>
        <path class="flag f1" d="M120 386 C 152 380 176 394 196 388 L 196 424 C 176 430 152 416 120 422 Z" fill="#8a2b2b"/>
        <line x1="1116" y1="470" x2="1116" y2="392" stroke="#3a3350" stroke-width="5"/>
        <path class="flag f2" d="M1116 394 C 1148 388 1170 402 1190 396 L 1190 430 C 1170 436 1148 422 1116 428 Z" fill="#8a2b2b"/>
      </g>

      <!-- 城墙上的哨兵剪影 -->
      <g fill="#100d19" stroke="#4c4370" stroke-width="1" opacity=".95">
        <g transform="translate(214 318) scale(1.1)">
          <circle cx="0" cy="-46" r="10"/>
          <path d="M-11 -34 L 11 -34 L 8 0 L -8 0 Z"/>
          <line x1="14" y1="-52" x2="6" y2="0" stroke="#151121" stroke-width="4"/>
        </g>
        <g transform="translate(1018 338) scale(1)">
          <circle cx="0" cy="-42" r="9"/>
          <path d="M-10 -31 L 10 -31 L 7 0 L -7 0 Z"/>
          <line x1="-13" y1="-48" x2="-5" y2="0" stroke="#151121" stroke-width="4"/>
        </g>
      </g>
    </g>

    <!-- near hills -->
    <g class="hills-near">
      <path d="M-1200 560 Q -1000 470 -800 555 T -400 560 T 0 545 L 0 700 L -1200 700 Z" fill="var(--hill-near)"/>
      <path d="M0 560 Q 200 470 400 555 T 800 560 T 1200 545 L 1200 700 L 0 700 Z" fill="var(--hill-near)"/>
    </g>

    <!-- ground -->
    <rect y="600" width="1200" height="100" fill="url(#groundGrad)"/>
    <ellipse cx="700" cy="626" rx="330" ry="46" fill="url(#groundLight)"/>
    <ellipse cx="470" cy="646" rx="300" ry="16" fill="#000" opacity=".5" filter="url(#soft)"/>
    <ellipse cx="330" cy="652" rx="150" ry="10" fill="#000" opacity=".4" filter="url(#soft)"/>
    <g stroke="#ffffff" stroke-opacity=".07" stroke-width="2">
      <line x1="40" y1="628" x2="320" y2="628"/>
      <line x1="420" y1="652" x2="760" y2="652"/>
      <line x1="880" y1="632" x2="1160" y2="632"/>
    </g>

    <!-- dust -->
    <g fill="#c9b6a4" opacity=".5">
      <circle class="p1" cx="300" cy="612" r="10"/>
      <circle class="p2" cx="280" cy="600" r="7"/>
      <circle class="p3" cx="330" cy="622" r="12"/>
      <circle class="p4" cx="295" cy="606" r="8"/>
    </g>

    <!-- ===== horse + bike ===== -->
    <g class="scene">
      <!-- shadow -->
      <ellipse cx="560" cy="648" rx="240" ry="18" fill="#000" opacity=".45" filter="url(#soft)"/>

      <!-- 马腿（后层） -->
      <g stroke-linecap="round" fill="none">
        <g class="leg bl" transform="translate(-38 0)">
          <path d="M486 498 C 470 528 458 566 454 594 C 452 610 453 624 457 634" stroke="#6b4227" stroke-width="29"/>
          <path d="M457 634 C 454 642 456 648 462 651" stroke="#5e3a24" stroke-width="17"/>
          <path d="M466 630 C 452 631 447 641 449 652 C 452 659 470 660 476 653 C 479 644 476 632 466 630 Z" fill="#2b1a10" stroke="none"/>
          <path d="M450 648 C 460 645 472 646 478 650" stroke="#8a7a63" stroke-width="2" opacity=".5"/>
        </g>
        <g class="leg fr" transform="translate(-14 0)">
          <path d="M700 486 C 712 516 720 558 722 590 C 723 606 722 620 719 630" stroke="#7c4d30" stroke-width="26"/>
          <path d="M719 630 C 722 638 721 645 715 648" stroke="#5e3a24" stroke-width="16"/>
          <path d="M708 628 C 694 629 689 639 691 650 C 694 657 712 658 718 651 C 721 642 718 630 708 628 Z" fill="#2b1a10" stroke="none"/>
          <path d="M692 646 C 702 643 714 644 720 648" stroke="#8a7a63" stroke-width="2" opacity=".5"/>
        </g>
      </g>

      <!-- 尾巴 -->
      <g class="tail">
        <path d="M384 424 C 336 414 300 452 306 500 C 310 534 330 560 352 572 C 340 538 342 496 366 470 C 378 456 388 442 396 434 Z" fill="#3d2517"/>
        <path d="M388 428 C 350 424 322 452 322 492 C 322 520 334 546 352 560 C 340 528 342 492 362 468 C 374 452 386 440 394 434 Z" fill="#523320" opacity=".85"/>
        <g stroke="#2b1a10" stroke-width="2" opacity=".5" fill="none">
          <path d="M382 436 C 350 442 330 474 336 512"/>
          <path d="M378 444 C 348 456 336 486 344 520"/>
        </g>
      </g>

      <!-- 身体 -->
      <path d="M704 400 C 668 380 604 372 544 375 C 476 378 418 392 390 424 C 368 450 366 488 380 514 C 396 544 442 558 502 558 C 562 558 612 548 652 530 C 692 512 716 480 719 450 C 721 426 715 408 704 400 Z" fill="url(#horseGrad)"/>
      <!-- 背脊高光 -->
      <path d="M398 418 C 470 384 620 372 700 402" stroke="#b98055" stroke-width="6" opacity=".35" fill="none" stroke-linecap="round"/>
      <!-- 腹部阴影 -->
      <path d="M396 500 C 440 542 600 552 668 512 C 636 548 540 562 470 552 C 430 546 406 526 396 500 Z" fill="#3d2517" opacity=".45"/>
      <!-- 肌肉线条 -->
      <!-- 肩部 / 臀部肌肉块 -->
      <g opacity=".55">
        <ellipse cx="452" cy="498" rx="52" ry="46" fill="#6b4227" transform="rotate(-8 452 498)"/>
        <ellipse cx="672" cy="492" rx="46" ry="42" fill="#7c4d30" transform="rotate(6 672 492)"/>
        <ellipse cx="452" cy="490" rx="34" ry="26" fill="#8a5a3b" opacity=".5"/>
        <ellipse cx="674" cy="486" rx="30" ry="24" fill="#8a5a3b" opacity=".45"/>
      </g>
      <g stroke="#3d2517" stroke-width="2.5" opacity=".28" fill="none" stroke-linecap="round">
        <path d="M432 470 C 470 486 520 488 560 478"/>
        <path d="M652 452 C 674 470 682 496 674 518"/>
        <path d="M418 442 C 440 462 446 486 440 508"/>
      </g>
      <!-- 斑点 -->
      <g fill="#c08a5c" opacity=".16">
        <ellipse cx="470" cy="432" rx="16" ry="11"/><ellipse cx="520" cy="412" rx="12" ry="8"/>
        <ellipse cx="600" cy="428" rx="18" ry="12"/><ellipse cx="646" cy="460" rx="11" ry="8"/>
        <ellipse cx="430" cy="486" rx="10" ry="7"/><ellipse cx="556" cy="500" rx="14" ry="9"/>
      </g>

      <!-- 马腿（前层） -->
      <g stroke-linecap="round" fill="none">
        <g class="leg fl" transform="translate(-30 0)">
          <path d="M520 500 C 512 530 506 566 504 592 C 503 608 505 622 509 632" stroke="#7c4d30" stroke-width="27"/>
          <path d="M509 632 C 506 640 508 646 514 649" stroke="#5e3a24" stroke-width="16"/>
          <path d="M518 628 C 504 629 499 639 501 650 C 504 657 522 658 528 651 C 531 642 528 630 518 628 Z" fill="#2b1a10" stroke="none"/>
          <path d="M502 646 C 512 643 524 644 530 648" stroke="#8a7a63" stroke-width="2" opacity=".5"/>
        </g>
        <g class="leg br" transform="translate(-40 0)">
          <path d="M672 494 C 684 524 692 564 694 592 C 695 608 694 620 691 630" stroke="#6b4227" stroke-width="25"/>
          <path d="M691 630 C 694 638 693 645 687 648" stroke="#5e3a24" stroke-width="15"/>
          <path d="M680 627 C 667 628 662 638 664 649 C 667 656 684 657 690 650 C 693 641 690 629 680 627 Z" fill="#2b1a10" stroke="none"/>
          <path d="M664 645 C 674 642 686 643 692 647" stroke="#8a7a63" stroke-width="2" opacity=".5"/>
        </g>
      </g>

      <!-- 脖子 -->
      <path d="M712 452 C 744 402 776 358 806 324 L 866 350 C 834 394 796 448 756 490 Z" fill="url(#horseGrad)"/>
      <path d="M742 462 C 772 418 800 378 826 348" stroke="#b98055" stroke-width="5" opacity=".22" fill="none" stroke-linecap="round"/>
      <!-- 鬃毛 -->
      <g fill="#2b1a10">
        <path d="M706 448 C 730 396 762 350 802 316 L 822 330 C 786 362 756 410 728 462 Z" opacity=".95"/>
        <path d="M712 444 C 736 398 764 358 798 326 L 806 332 C 774 366 746 408 722 452 Z" fill="#3d2517"/>
      </g>
      <g stroke="#151009" stroke-width="2.5" opacity=".55" fill="none" stroke-linecap="round">
        <path d="M714 442 C 730 404 754 366 782 338"/>
        <path d="M722 452 C 740 414 766 376 794 348"/>
        <path d="M708 452 C 722 416 742 384 768 356"/>
      </g>

      <!-- 头 -->
      <g>
        <!-- 耳 -->
        <path d="M812 300 C 806 282 810 266 820 256 C 826 272 826 288 824 302 Z" fill="#7c4d30"/>
        <path d="M816 296 C 813 284 815 274 820 268 C 823 278 823 288 822 296 Z" fill="#3d2517" opacity=".6"/>
        <path d="M828 294 C 828 276 836 262 846 256 C 848 272 842 288 836 300 Z" fill="#6b4227"/>
        <!-- 头颅到口鼻 -->
        <path d="M806 306 C 826 288 856 288 874 304 C 888 318 900 340 902 356 C 904 374 894 388 878 388 C 858 388 838 372 824 352 C 810 332 798 322 806 306 Z" fill="#8a5a3b"/>
        <!-- 面部高光 -->
        <path d="M846 300 C 862 302 874 312 880 326 C 884 338 882 350 874 356 C 866 342 856 320 846 300 Z" fill="#a06b47" opacity=".55"/>
        <!-- 颊部阴影与下颌 -->
        <path d="M824 352 C 838 366 856 380 872 384 C 858 388 840 380 828 366 Z" fill="#3d2517" opacity=".45"/>
        <path d="M860 330 C 874 344 886 360 892 374" stroke="#3d2517" stroke-width="2" opacity=".35" fill="none"/>
        <!-- 鼻孔 -->
        <ellipse cx="890" cy="360" rx="5.5" ry="4" fill="#3d2517" transform="rotate(20 890 360)"/>
        <!-- 嘴 -->
        <path d="M896 376 C 902 378 904 384 900 388" stroke="#3d2517" stroke-width="2" fill="none" opacity=".8"/>
        <!-- 眼睛 -->
        <ellipse cx="842" cy="332" rx="8" ry="7" fill="#150d08"/>
        <circle cx="844.5" cy="329.5" r="2.6" fill="#fff" opacity=".9"/>
        <path d="M833 326 C 838 322 849 321 854 325" stroke="#150d08" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <!-- 额前碎毛 -->
        <g stroke="#2b1a10" stroke-width="3" fill="none" stroke-linecap="round" opacity=".9">
          <path d="M816 302 C 822 292 830 286 838 284"/>
          <path d="M808 306 C 812 296 818 288 826 284"/>
        </g>
        <!-- 笼头 -->
        <g stroke="#c9a227" stroke-width="4" fill="none" stroke-linecap="round">
          <path d="M836 296 C 852 320 862 346 858 380"/>
          <path d="M812 334 C 838 340 866 342 894 338"/>
          <path d="M876 300 C 884 320 892 342 894 360"/>
        </g>
        <!-- 缰绳 -->
        <path d="M858 382 C 838 400 812 412 790 412" stroke="#8a2b2b" stroke-width="3.5" fill="none" stroke-linecap="round" opacity=".85"/>
      </g>

      <!-- 战马甲具 -->
      <g id="barding">
        <!-- 鞍垫 / saddle blanket -->
        <path d="M470 404 C 520 386 600 384 648 400 L 652 452 C 604 470 520 470 470 452 Z" fill="#8a2b2b" opacity=".95"/>
        <path d="M470 452 C 520 470 604 470 652 452 L 654 470 C 606 490 518 490 468 470 Z" fill="#c9a227" opacity=".9"/>
        <!-- 胸甲 -->
        <path d="M700 470 C 726 492 736 528 726 556 C 706 546 692 516 686 486 Z" fill="#3a3350" stroke="#8fa3bf" stroke-width="2" opacity=".95"/>
        <!-- 颈甲 -->
